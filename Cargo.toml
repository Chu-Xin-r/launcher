[workspace]
resolver = "2"
members = ["crates/searchcore", "src-tauri"]

[replace]
"windows-link:0.1.3" = { path = "vendor/windows-link-0.1.3" }
"windows-link:0.2.1" = { path = "vendor/windows-link-0.2.1" }
"windows-targets:0.53.5" = { path = "vendor/windows-targets-0.53.5" }
"dirs-sys:0.5.0" = { path = "vendor/dirs-sys-0.5.0" }
"tauri-winres:0.3.6" = { path = "vendor/tauri-winres-0.3.6" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
